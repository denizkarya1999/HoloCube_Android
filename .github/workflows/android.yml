name: HoloCube Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Chaquopy's pip step needs the embedded Python version (3.8) on the build machine.
      # actions/setup-python no longer ships 3.8 for current Ubuntu runners, so use the
      # same isolated uv-managed interpreter that developers use locally.
      - name: Install an isolated Python 3.8 for Chaquopy
        run: bash Tools/setup-python.sh
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Unit tests, debug APK, device-test APK, and Android lint
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HoloCube-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HoloCube-Android-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest
